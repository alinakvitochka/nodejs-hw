<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7; padding: 32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 32px;">
            <tr>
              <td style="font-size: 20px; font-weight: bold; color: #1f1f2e; padding-bottom: 16px;">
                Reset your password
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; line-height: 21px; color: #4a4a5a;">
                Hi {{name}},<br />
                <br />
                We received a request to reset your password. Click the link below to choose a new one:
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0;">
                <a href="{{link}}" style="display: inline-block; background-color: #4f46e5; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: bold; padding: 12px 24px; border-radius: 6px;">
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 20px; color: #8a8a99; word-break: break-all;">
                Or paste this link into your browser:<br />
                {{link}}
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 20px; color: #8a8a99; padding-top: 16px;">
                This link is valid for 15 minutes.<br />
                If you did not request a password reset, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
